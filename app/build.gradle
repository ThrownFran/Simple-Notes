plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs'
    id 'kotlin-parcelize'
    id 'com.mikepenz.aboutlibraries.plugin'
    id 'com.google.gms.google-services'
    // Add the Crashlytics Gradle plugin
    id 'com.google.firebase.crashlytics'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'com.github.triplet.play'
}

ktlint {
    android.set(true)
}

// --- Release signing ---
// Local dev (macOS): keystore.properties holds only storeFile + keyAlias (non-secret).
// storePassword/keyPassword are never written to disk - they're read from macOS Keychain
// at build time (see KEYCHAIN_SERVICE below).
// CI: the publish workflow writes a full keystore.properties (including passwords) from
// GitHub Actions secrets to an ephemeral file on the runner - there's no Keychain on
// Linux runners, so CI keeps the plaintext-file path.
// Ambient CI runs (e.g. the day-to-day build/test workflow) that don't provide a signing
// source are allowed to build an unsigned release artifact for validation only; outside
// CI, a missing signing source fails the build instead of silently producing an unsigned
// artifact.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasKeystoreProperties = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasKeystoreProperties) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def isCi = System.getenv("CI") == "true"
def KEYCHAIN_SERVICE = "SimpleNotes-ReleaseKeystore"

def readFromKeychain = { String account ->
    def stdout = new ByteArrayOutputStream()
    def result = exec {
        commandLine "security", "find-generic-password", "-a", account, "-s", KEYCHAIN_SERVICE, "-w"
        standardOutput = stdout
        errorOutput = new ByteArrayOutputStream()
        ignoreExitValue = true
    }
    return result.exitValue == 0 ? stdout.toString().trim() : null
}

// Only touch signing (including Keychain, which can prompt for access) when a task that
// actually packages a release build is requested, so plain `test`/`ktlintCheck`/
// `assembleDebug` runs never need a keystore or trigger a Keychain prompt.
gradle.taskGraph.whenReady { graph ->
    def needsReleaseSigning = graph.allTasks.any { task ->
        task.name == "assembleRelease" || task.name == "bundleRelease" ||
            task.name.startsWith("publishRelease") || task.name.startsWith("publishBundle")
    }
    if (!needsReleaseSigning) return

    if (!hasKeystoreProperties) {
        if (isCi) return
        throw new GradleException(
            "Release signing is not configured. Copy keystore.properties.example to " +
                "keystore.properties and fill in your keystore details before building " +
                "assembleRelease/bundleRelease.",
        )
    }

    def storePassword = isCi ? keystoreProperties["storePassword"] : readFromKeychain("storePassword")
    def keyPassword = isCi ? keystoreProperties["keyPassword"] : readFromKeychain("keyPassword")
    if (!storePassword || !keyPassword) {
        throw new GradleException(
            isCi
                ? "Release signing is not configured: keystore.properties is missing storePassword/keyPassword."
                : "Release signing is not configured: storePassword/keyPassword not found in macOS " +
                    "Keychain. Add them with:\n" +
                    "  security add-generic-password -a storePassword -s $KEYCHAIN_SERVICE -w\n" +
                    "  security add-generic-password -a keyPassword -s $KEYCHAIN_SERVICE -w",
        )
    }
    android.signingConfigs.release.storePassword = storePassword
    android.signingConfigs.release.keyPassword = keyPassword
}

// --- CD-driven versionCode ---
// Falls back to the checked-in constant so local/unsigned builds are unaffected.
def cdVersionCode = System.getenv("CD_VERSION_CODE")

android {
    compileSdk 36

    defaultConfig {
        applicationId "brillembourg.notes.simple.fast"
        minSdk 21
        targetSdk 36
        versionCode cdVersionCode ? cdVersionCode.toInteger() : 9
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                keyAlias keystoreProperties['keyAlias']
                // storePassword / keyPassword are populated later, in
                // gradle.taskGraph.whenReady above, once we know a release-packaging
                // task actually needs them (Keychain locally, CI secrets in CI).
            }
        }
        // else: isCi with no signing source (already validated above) - no release
        // signingConfig is created, so buildTypes.release below stays unsigned.
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        dataBinding true
    }

    viewBinding {
        enabled = true
    }
    namespace 'brillembourg.notes.simple'
}

kotlin {
    jvmToolchain(21)
}

// --- Play Store publishing (Gradle Play Publisher) ---
// The publish workflow writes the Play service-account JSON from a secret to a file and
// exports its path via PLAY_SERVICE_ACCOUNT_JSON_PATH before invoking `publishBundle`.
// Nothing here is used by test/ktlintCheck/assembleDebug/assembleRelease.
play {
    serviceAccountCredentials.set(
        file(System.getenv("PLAY_SERVICE_ACCOUNT_JSON_PATH") ?: "play-service-account.json"),
    )
    track.set("internal")
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:3.0.0-RC3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    //Navigation
    def nav_version = "2.7.7"
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation("androidx.datastore:datastore-preferences:1.1.1")

    implementation "com.google.dagger:hilt-android:2.58"
    kapt "com.google.dagger:hilt-compiler:2.58"

    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    implementation('de.raphaelebner:roomdatabasebackup:1.0.0-beta12') {
        // Excluded: room-guava/room-rxjava2 are dragged to the app's Room version by Room's
        // version-alignment mechanism, and room-guava requires minSdk 23. The app doesn't use
        // roomdatabasebackup's Guava/RxJava2 API surface, only its plain backup/restore API.
        exclude group: 'androidx.room', module: 'room-guava'
        exclude group: 'androidx.room', module: 'room-rxjava2'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.mockk:mockk:1.14.11"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-debug:1.6.4'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation "com.mikepenz:aboutlibraries-core:10.6.1"
    implementation "com.mikepenz:aboutlibraries:10.6.1"

    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.6'

    //In App Review
    // This dependency is downloaded from the Google’s Maven repository.
    // So, make sure you also include that repository in your project's build.gradle file.
    implementation("com.google.android.play:review:2.0.1")

    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'
}
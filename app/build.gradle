plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs'
    id 'kotlin-parcelize'
    id 'com.mikepenz.aboutlibraries.plugin'
    id 'com.google.gms.google-services'
    // Add the Crashlytics Gradle plugin
    id 'com.google.firebase.crashlytics'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'com.github.triplet.play'
}

ktlint {
    android.set(true)
}

// --- Release signing ---
// Signing only ever happens in CI: the publish workflow writes keystore.properties
// (storeFile/storePassword/keyAlias/keyPassword) from repository secrets to an ephemeral
// file on the runner before invoking Gradle. Locally there's no keystore.properties, so
// `assembleRelease`/`bundleRelease` build unsigned - for a real signed local build (e.g.
// to test a release-shaped artifact before shipping), use Android Studio's
// Build > Generate Signed Bundle/APK wizard instead, which manages its own credentials
// independent of this file.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasKeystoreProperties = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasKeystoreProperties) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// --- CD-driven versionCode/versionName ---
// Both fall back to the checked-in constants so local/unsigned builds are unaffected.
// The publish workflow derives CD_VERSION_NAME from the pushed tag (or a required manual
// input for workflow_dispatch), so the tag is the single source of truth for what ships -
// this constant is never relied on for a real publish.
def cdVersionCode = System.getenv("CD_VERSION_CODE")
def cdVersionName = System.getenv("CD_VERSION_NAME")

android {
    compileSdk 36

    defaultConfig {
        applicationId "brillembourg.notes.simple.fast"
        minSdk 21
        targetSdk 36
        versionCode cdVersionCode ? cdVersionCode.toInteger() : 9
        versionName cdVersionName ?: "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
        // else: no keystore.properties (the local/no-CD case) - no release signingConfig
        // is created, so buildTypes.release below stays unsigned.
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        dataBinding true
    }

    viewBinding {
        enabled = true
    }
    namespace 'brillembourg.notes.simple'
}

kotlin {
    jvmToolchain(21)
}

// --- Play Store publishing (Gradle Play Publisher) ---
// The publish workflow writes the Play service-account JSON from a secret to a file and
// exports its path via PLAY_SERVICE_ACCOUNT_JSON_PATH before invoking `publishBundle`.
// Nothing here is used by test/ktlintCheck/assembleDebug/assembleRelease.
play {
    serviceAccountCredentials.set(
        file(System.getenv("PLAY_SERVICE_ACCOUNT_JSON_PATH") ?: "play-service-account.json"),
    )
    track.set("internal")
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:3.0.0-RC3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    //Navigation
    def nav_version = "2.7.7"
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation("androidx.datastore:datastore-preferences:1.1.1")

    implementation "com.google.dagger:hilt-android:2.58"
    kapt "com.google.dagger:hilt-compiler:2.58"

    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.mockk:mockk:1.14.11"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-debug:1.6.4'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation "com.mikepenz:aboutlibraries-core:10.6.1"
    implementation "com.mikepenz:aboutlibraries:10.6.1"

    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.6'

    //In App Review
    // This dependency is downloaded from the Google’s Maven repository.
    // So, make sure you also include that repository in your project's build.gradle file.
    implementation("com.google.android.play:review:2.0.1")

    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'
}
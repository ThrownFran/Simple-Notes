buildscript {

    dependencies {
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.58'
        def nav_version = "2.7.7"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:10.6.1"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    }

    repositories {
        google()
        mavenCentral()
    }

}


// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
    id 'com.mikepenz.aboutlibraries.plugin' version '10.6.1' apply true
    id 'org.jlleitschuh.gradle.ktlint' version '12.1.2' apply false
    // Pinned to 3.x: GPP 4.0+ requires Gradle 9.1+/AGP 9, this project is on Gradle 8.13/AGP 8.13.
    id 'com.github.triplet.play' version '3.13.0' apply false
}




task clean(type: Delete) {
    delete rootProject.buildDir
}